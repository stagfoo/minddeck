name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        # arm64-only: a debug build bundles a full Flutter debug engine per
        # ABI, so a universal APK is ~160MB against ~55MB for one. arm64-v8a
        # covers every real Android phone from the last ~8 years.
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: minddeck-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 14
